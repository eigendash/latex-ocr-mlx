[project]
name = "latex-ocr-mlx"
version = "0.1.0"
description = "A small image-to-LaTeX model trained on synthetic formulas, written in MLX"
requires-python = ">=3.10"
dependencies = ["mlx>=0.22", "numpy", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
